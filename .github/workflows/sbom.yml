name: SBOM

on:
  push:
    branches:
      - master
      - sbom-dev-1
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  sbom:
    if: ${{ github.ref_name == 'sbom-dev-1' }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout devextreme-exceljs-fork repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous build
        run: pnpm run clean

      - name: Build package
        run: pnpm run build

      - name: Pack package
        run: |
          package_tgz=$(pnpm pack --json | jq -er 'if type=="array" then .[0].filename else .filename end')
          echo "PACKAGE_TGZ=$(realpath "$package_tgz")" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ env.PACKAGE_TGZ }}
          if-no-files-found: error

      - name: Set GitHub Packages auth
        run: pnpm set //npm.pkg.github.com/:_authToken="${NODE_AUTH_TOKEN}"

      - name: Build SBOM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tools/make-sbom
          pnpm install --frozen-lockfile
          pnpm dx-make-sbom ../../ dist/ "devextreme-exceljs-fork($PACKAGE_TGZ)"

      - name: Validate SBOM
        uses: DevExpress/github-actions/validate-sbom@5034a6d5e0fd18fc2826ed20a5140f9c83b8994f
        with:
          input-file: tools/make-sbom/dist/devextreme-exceljs-fork.cdx.json

      - name: Publish SBOM to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(pnpm pkg get version | tr -d '"')"
          mkdir -p tools/make-sbom/pack && cp tools/make-sbom/dist/devextreme-exceljs-fork.cdx.json tools/make-sbom/pack/
          jq -n --arg v "$version" '{name:"@devexpress/devextreme-exceljs-fork-sbom",version:$v}' > tools/make-sbom/pack/package.json
          cd tools/make-sbom/pack
          pnpm publish --registry https://npm.pkg.github.com --no-git-checks

  publish:
    needs: sbom
    runs-on: ubuntu-slim
    steps:
      - name: Checkout devextreme-exceljs-fork repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: package
          path: package

      - name: Publish to NPM (dry run)
        run: |
          package_tgz=$(ls package/*.tgz)
          pnpm publish "$package_tgz" --provenance --no-git-checks --dry-run
