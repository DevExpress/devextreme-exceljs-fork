name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Publishing version (tag name)
      dry-run:
        type: boolean
        required: false
        default: false
        description: Dry run

permissions:
  id-token: write  # Required for OIDC (Trusted Publishing)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npmjs
    steps:
      - name: Checkout devextreme-exceljs-fork repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous build
        run: pnpm run clean

      - name: Build package
        run: pnpm run build

      - name: Pack package
        run: |
          package_tgz=$(pnpm pack --json | jq -r '.filename')
          echo "PACKAGE_TGZ=$package_tgz" >> "$GITHUB_ENV"

      - name: Verify build artifacts
        run: |
          echo "Verifying build artifacts..."
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/dx-exceljs-fork.min.js" ]; then
            echo "Error: minified bundle not found"
            exit 1
          fi
          if [ ! -f "dist/dx-exceljs-fork.js" ]; then
            echo "Error: main bundle not found"
            exit 1
          fi
          echo "All build artifacts verified successfully"

      - name: Publish to NPM
        env:
          DRY_RUN: "${{ inputs.dry-run }}"
        run: |
          if [ -z "$PACKAGE_TGZ" ] || [ ! -f "$PACKAGE_TGZ" ]; then
            echo "Error: packed tgz file not found: $PACKAGE_TGZ"
            exit 1
          fi

          if [ "$DRY_RUN" = true ]; then
            npm publish "$PACKAGE_TGZ" --dry-run
          else
            npm publish "$PACKAGE_TGZ"
          fi
