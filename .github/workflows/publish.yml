name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Publishing version (tag name)
      dry-run:
        type: boolean
        required: false
        default: false
        description: Dry run

permissions:
  id-token: write  # Required for OIDC (Trusted Publishing)
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npmjs
    steps:
      - name: Checkout devextreme-exceljs-fork repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous build
        run: pnpm run clean

      - name: Build package
        run: pnpm run build

      - name: Pack package
        run: |
          package_tgz=$(pnpm pack --json | jq -er 'if type=="array" then .[0].filename else .filename end')
          echo "PACKAGE_TGZ=$(realpath "$package_tgz")" >> "$GITHUB_ENV"

      - name: Build SBOM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm set //npm.pkg.github.com/:_authToken="$NODE_AUTH_TOKEN"
          cd tools/make-sbom && pnpm install --frozen-lockfile && pnpm dx-make-sbom ../../ dist/ "devextreme-exceljs-fork($PACKAGE_TGZ)"

      - name: Validate SBOM
        uses: DevExpress/github-actions/validate-sbom@5034a6d5e0fd18fc2826ed20a5140f9c83b8994f
        with:
          input-file: tools/make-sbom/dist/devextreme-exceljs-fork.cdx.json

      - name: Publish SBOM to npm.pkg.github.com
        run: |
          mkdir -p tools/make-sbom/pack && cp tools/make-sbom/dist/devextreme-exceljs-fork.cdx.json tools/make-sbom/pack/
          jq -n --arg v "$(pnpm pkg get version | tr -d '\"')" '{name:"@devexpress/devextreme-exceljs-fork-sbom",version:$v}' > tools/make-sbom/pack/package.json
          cd tools/make-sbom/pack
          pnpm publish --registry https://npm.pkg.github.com --no-git-checks

      - name: Verify build artifacts
        run: |
          echo "Verifying build artifacts..."
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/dx-exceljs-fork.min.js" ]; then
            echo "Error: minified bundle not found"
            exit 1
          fi
          if [ ! -f "dist/dx-exceljs-fork.js" ]; then
            echo "Error: main bundle not found"
            exit 1
          fi
          echo "All build artifacts verified successfully"

      - name: Publish to NPM
        env:
          DRY_RUN: "${{ inputs.dry-run }}"
        run: |
          if [ -z "$PACKAGE_TGZ" ] || [ ! -f "$PACKAGE_TGZ" ]; then
            echo "Error: packed tgz file not found: $PACKAGE_TGZ"
            exit 1
          fi

          if [ "$DRY_RUN" = true ]; then
            pnpm publish "$PACKAGE_TGZ" --provenance --no-git-checks --dry-run
          else
            pnpm publish "$PACKAGE_TGZ" --provenance --no-git-checks
          fi
